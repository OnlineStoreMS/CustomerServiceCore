server:
  port: 8108
  mode: debug
database:
  driver: sqlite
  sqlite_path: data/customerservicecore.db
auth:
  enabled: true
  jwt_secret: change-me-same-as-usercore
  plugin_secret_key: change-me-plugin-aes-key
cors:
  allow_origins:
    - http://localhost:5193
    - http://localhost:5174
apps:
  public_base_url: http://localhost:5193
llm:
  enabled: true
  provider: deepseek
  api_base: https://api.deepseek.com
  api_key: "" # 或环境变量 LLM_API_KEY
  model: deepseek-chat
  timeout_sec: 8
  max_chars: 40
